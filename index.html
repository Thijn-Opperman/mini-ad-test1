<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Mini Lesson Playable Ad</title>
  <style>
    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --blue: #1cb0f6;
      --bg: #f7f7fb;
      --text: #1f1f1f;
      --muted: #7d7d86;
      --surface: #ffffff;
      --danger: #ff4d4f;
      --success: #2cbf4b;
      --shadow: 0 6px 18px rgba(28, 176, 246, 0.14);
      --radius: 18px;
      --tap-highlight: rgba(0, 0, 0, 0);
      --screen-pad-x: clamp(14px, 4.2vw, 18px);
      --screen-pad-top: clamp(16px, 4.6vw, 22px);
      --screen-pad-bottom: clamp(16px, 3.8vw, 20px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: var(--tap-highlight);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      height: 100%;
      position: relative;
      background: var(--bg);
    }

    .top-nav {
      display: none;
    }

    .back-btn {
      pointer-events: auto;
      border: 2px solid rgba(31, 31, 31, 0.12);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 900;
      color: #1f1f1f;
      box-shadow: 0 6px 14px rgba(31, 31, 31, 0.08);
      cursor: pointer;
      transition: transform 0.06s ease, filter 0.12s ease;
    }

    .back-btn:active {
      transform: scale(0.98);
    }

    .screen {
      position: absolute;
      inset: 0;
      padding: var(--screen-pad-top) var(--screen-pad-x) calc(var(--screen-pad-bottom) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      z-index: 2;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .center.with-progress {
      justify-content: flex-start;
    }

    .headline {
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .title {
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      margin: 8px 0 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin: 0 0 14px;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      min-height: 52px;
      width: 100%;
      font-size: clamp(16px, 4.3vw, 18px);
      font-weight: 800;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.16s ease, box-shadow 0.18s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:hover {
      filter: brightness(1.03);
    }

    .btn-primary {
      background: var(--green);
      color: #fff;
      box-shadow: 0 5px 0 var(--green-dark);
    }

    .btn-secondary {
      background: #e9f7ff;
      color: #1476a6;
      box-shadow: 0 4px 0 #cfeefe;
    }

    .btn.disabled,
    .btn:disabled {
      opacity: 0.55;
      box-shadow: none;
      cursor: default;
    }

    .bubble {
      margin-top: 90px;
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .welcome-layout {
      position: relative;
      flex: 1;
      margin-top: 10px;
      min-height: clamp(270px, 46vh, 340px);
    }

    .welcome-layout .bubble {
      max-width: min(62vw, 248px);
      margin-top: clamp(94px, 20vh, 118px);
      margin-left: 0;
      position: relative;
      z-index: 1;
      text-align: left;
      font-size: clamp(16px, 5vw, 22px);
      line-height: 1.18;
    }

    .welcome-layout .bubble::after {
      content: "";
      position: absolute;
      right: -14px;
      top: 56%;
      width: 0;
      height: 0;
      border-left: 14px solid #ffffff;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      transform: translateY(-50%);
    }

    .welcome-duo {
      width: clamp(228px, 76vw, 312px);
      position: absolute;
      right: calc(clamp(228px, 76vw, 312px) * -0.52);
      top: clamp(136px, 28vh, 172px);
      transform: translateX(160px) rotate(-14deg);
      opacity: 0;
      cursor: pointer;
      transition: filter 0.16s ease;
    }

    .welcome-duo.fly-in {
      animation: duoFlyIn 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .welcome-duo.tap-bounce {
      animation: duoTapBounce 260ms ease;
    }

    .welcome-duo:hover {
      filter: brightness(1.04);
    }

    .bottom-wrap {
      margin-top: auto;
      padding-top: 14px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .progress-wrap {
      margin: 6px 0 14px;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #e5e8f0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #58cc02, #7be82a);
      transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.26) 50%, transparent 100%);
      transform: translateX(-120%);
      animation: progressShimmer 1.4s ease-out;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .lang-btn,
    .topic-btn,
    .option-btn,
    .word-btn {
      border: 2px solid #e6e8ef;
      background: #fff;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 17px;
      font-weight: 700;
      color: #363636;
      min-height: 52px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease, background 0.14s ease, box-shadow 0.16s ease;
      text-align: center;
    }

    .lang-btn:active,
    .topic-btn:active,
    .option-btn:active,
    .word-btn:active {
      transform: scale(0.98);
    }

    .lang-btn:hover,
    .topic-btn:hover,
    .option-btn:hover,
    .word-btn:hover {
      box-shadow: 0 4px 10px rgba(31, 31, 31, 0.08);
    }

    .selected {
      border-color: var(--blue);
      background: #eef9ff;
    }

    .correct {
      border-color: var(--success) !important;
      background: #eaf9ee !important;
      animation: pop 260ms ease;
    }

    .wrong {
      border-color: var(--danger) !important;
      background: #ffeef0 !important;
      animation: shake 300ms ease;
    }

    .xp {
      font-size: 52px;
      font-weight: 900;
      color: var(--green);
      margin: 4px 0 2px;
    }

    .mascot {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #7be82a;
      position: relative;
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.08);
    }

    .eye {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 50%;
      top: 36px;
      animation: blink 2s infinite;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #222;
      top: 9px;
      left: 10px;
    }

    .eye.left { left: 24px; }
    .eye.right { right: 24px; }

    .audio-pill {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 6px auto 14px;
      background: #eaf8ff;
      border: 4px solid #d0efff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      animation: pulse 1.1s infinite;
    }

    .sentence-box {
      min-height: 74px;
      margin-bottom: 10px;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      border: 2px dashed #d9dfeb;
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .word-bank {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .streak {
      font-size: 56px;
      margin-top: 14px;
    }

    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #d8dde8;
    }

    .dot.active {
      background: #ff8f3f;
    }

    .brand {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #fff;
      text-transform: uppercase;
    }

    .splash {
      background: var(--green);
      color: #fff;
    }

    #screen-0 {
      padding: 0;
    }

    @font-face {
      font-family: "Feather";
      src: url("./Feather.woff2") format("woff2");
      font-display: swap;
    }

    .duo-logo {
      font-family: "Feather", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-top: 18px;
      text-transform: lowercase;
      color: #ffffff;
      text-shadow: none;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
    }

    .splash-center {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-eyes {
      width: 170px;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .splash-logo {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      margin: 0;
      color: #ffffff !important;
    }

    .top-nav.off {
      display: none;
    }

    .mascot-img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      animation: mascotFloat 3.2s ease-in-out infinite;
    }

    .mascot-splash {
      width: 160px;
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
    }

    .mascot-welcome {
      width: 84px;
      margin: 8px auto 14px;
    }

    .topic-visuals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 4px 0 10px;
    }

    .topic-visual {
      border-radius: 12px;
      border: 2px solid #e6e8ef;
      background: #fff;
      padding: 8px;
      min-height: 88px;
    }

    .topic-visual img {
      width: 100%;
      max-height: 70px;
    }

    .topic-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 10px;
    }

    .topic-question {
      flex: 1;
      background: #efefef;
      border: 3px solid #d4d4d4;
      border-radius: 16px;
      padding: 14px 16px;
      color: #4a4a4a;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      position: relative;
    }

    .topic-question::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 40px;
      width: 0;
      height: 0;
      border-left: 10px solid #d4d4d4;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }

    .topic-question::before {
      content: "";
      position: absolute;
      right: -6px;
      top: 42px;
      width: 0;
      height: 0;
      border-left: 8px solid #efefef;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      z-index: 1;
    }

    .topic-duo {
      width: 84px;
      flex-shrink: 0;
    }

    .topic-picker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .topic-picker-grid .topic-btn {
      min-height: 146px;
      border-radius: 18px;
      padding: 10px 8px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      background: #efefef;
      border-color: #dcdcdc;
      font-size: 33px;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.03);
    }

    .topic-picker-grid .topic-btn.selected {
      border-color: var(--blue);
      background: #ecf8ff;
    }

    .topic-card-img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .topic-label {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.15;
      color: #444;
      text-align: center;
      white-space: normal;
    }

    .reward-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e880cb;
      font-size: 20px;
      font-weight: 900;
      margin: 4px 0 12px;
      justify-content: flex-end;
    }

    #screen-1,
    #screen-2,
    #screen-3 {
      padding-top: calc(clamp(62px, 11vh, 72px) + env(safe-area-inset-top));
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    #screen-1 .progress-wrap,
    #screen-2 .progress-wrap,
    #screen-3 .progress-wrap {
      position: absolute;
      top: calc(clamp(16px, 3.8vh, 24px) + env(safe-area-inset-top));
      left: var(--screen-pad-x);
      right: clamp(84px, 24vw, 110px);
      width: auto;
      margin: 0;
      z-index: 2;
    }

    #screen-1 .reward-pill,
    #screen-2 .reward-pill,
    #screen-3 .reward-pill {
      position: absolute;
      top: calc(clamp(14px, 3.6vh, 22px) + env(safe-area-inset-top));
      right: var(--screen-pad-x);
      margin: 0;
      z-index: 2;
    }

    #screen-1 .bottom-wrap,
    #screen-2 .bottom-wrap,
    #screen-3 .bottom-wrap {
      position: absolute;
      left: var(--screen-pad-x);
      right: var(--screen-pad-x);
      bottom: calc(16px + env(safe-area-inset-bottom));
      margin-top: 0;
      padding-top: 0;
      z-index: 3;
    }

    .reward-pill span {
      display: inline-block;
      font-size: 16px;
      line-height: 1;
    }

    .language-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 10px;
    }

    .language-duo {
      width: 90px;
      flex-shrink: 0;
    }

    .language-question {
      flex: 1;
      background: #efefef;
      border: 3px solid #d4d4d4;
      border-radius: 16px;
      padding: 14px 16px;
      color: #4a4a4a;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      position: relative;
    }

    .language-question::after {
      content: "";
      position: absolute;
      left: -10px;
      top: 38px;
      width: 0;
      height: 0;
      border-right: 10px solid #d4d4d4;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }

    .language-question::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 40px;
      width: 0;
      height: 0;
      border-right: 8px solid #efefef;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      z-index: 1;
    }

    .language-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .language-list .lang-btn {
      min-height: 52px;
      border-radius: 14px;
      border: 2px solid #dcdcdc;
      background: #ececec;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: flex-start;
      font-size: 32px;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.03);
    }

    .language-list .lang-btn.selected {
      border-color: var(--blue);
      background: #ecf8ff;
    }

    .flag {
      width: 58px;
      height: 38px;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .flag-label {
      font-size: 33px;
      font-weight: 800;
      color: #4a4a4a;
    }

    .flag-en {
      background:
        linear-gradient(to right, transparent 42%, #d9142a 42%, #d9142a 58%, transparent 58%),
        linear-gradient(to bottom, transparent 42%, #d9142a 42%, #d9142a 58%, transparent 58%),
        #ffffff;
    }

    .flag-fr {
      background: linear-gradient(to right, #042f7a 33.33%, #ffffff 33.33%, #ffffff 66.66%, #d9142a 66.66%);
    }

    .flag-de {
      background: linear-gradient(to bottom, #000000 33.33%, #d9142a 33.33%, #d9142a 66.66%, #f1c40f 66.66%);
    }

    .flag-it {
      background: linear-gradient(to right, #008c45 33.33%, #ffffff 33.33%, #ffffff 66.66%, #cd212a 66.66%);
    }

    .flag-es {
      background: linear-gradient(to bottom, #c60b1e 25%, #ffc400 25%, #ffc400 75%, #c60b1e 75%);
    }

    .flag-jp {
      background: #ffffff;
    }

    .flag-jp::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #be002f;
      top: 7px;
      left: 17px;
    }

    .flag-cn {
      background: #ff1d25;
    }

    .flag-cn::before {
      content: "★";
      position: absolute;
      top: 3px;
      left: 7px;
      color: #ffde00;
      font-size: 14px;
      line-height: 1;
    }

    .mascot-xp {
      width: 120px;
      margin: 0 auto 8px;
    }

    .mascot-streak {
      width: 120px;
      margin: 0 auto 8px;
    }

    .mascot-cta {
      width: 130px;
      margin: 6px auto 10px;
    }

    .hidden {
      visibility: hidden;
    }

    .anim-fade-up {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 360ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-stagger-1 { animation-delay: 40ms; }
    .anim-stagger-2 { animation-delay: 90ms; }
    .anim-stagger-3 { animation-delay: 140ms; }
    .anim-stagger-4 { animation-delay: 190ms; }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.15); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes mascotFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes progressShimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    @keyframes duoFlyIn {
      0% {
        transform: translateX(170px) rotate(-16deg);
        opacity: 0;
      }
      70% {
        transform: translateX(-10px) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: translateX(0) rotate(0);
        opacity: 1;
      }
    }

    @keyframes duoTapBounce {
      0% { transform: translateX(0) scale(1); }
      45% { transform: translateX(0) scale(1.06); }
      100% { transform: translateX(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-height: 740px) {
      .welcome-layout {
        min-height: 230px;
      }

      const languageButtons = Array.from(document.querySelectorAll(".lang-btn"));

      const app = document.getElementById("app");

      function getT(key) {
        const langPack = translations[state.selectedLanguage] || translations.en;
        return langPack[key] || translations.en[key] || key;
      }

      function safeAdvance(nextStep) {
        const step = Number.isInteger(nextStep) ? nextStep : state.currentStep + 1;
        const clamped = Math.max(0, Math.min(3, step));
        showScreen(clamped);
      }

      function resetInteractiveStateForStep(step) {
        if (step <= 3) {
          state.answers.exercise1 = null;
          state.answers.exercise2 = null;
          state.answers.exercise3 = null;
          state.sentenceWords = [];
        }
      }

      function shouldShowBack(step) {
        return step >= 2 && step <= 3;
      }

      function showScreen(step, opts) {
        const fromBack = opts && opts.fromBack;
        const prev = state.currentStep;

        if (!fromBack && prev !== step) {
          state.navStack.push(prev);
          if (state.navStack.length > 24) state.navStack.shift();
        }

        state.currentStep = step;
        screens.forEach((screen, idx) => {
          screen.classList.toggle("active", idx === step);
        });
        const dynamicProgress = getProgressForStep(step);
        document.querySelectorAll(".progress-bar").forEach((bar) => {
          const target = bar.getAttribute("data-progress");
          if (!target || target === "auto") {
            bar.style.width = dynamicProgress + "%";
            return;
          }
          bar.style.width = target + "%";
        });
        animateScreenIn(step);
        triggerWelcomeDuo(step);

        const showBack = shouldShowBack(step) && state.navStack.length > 0;
        if (backBtn) backBtn.classList.toggle("hidden", !showBack);

        resetInteractiveStateForStep(step);
      }

      function triggerWelcomeDuo(step) {
        if (!welcomeDuo || step !== 1) return;
        welcomeDuo.classList.remove("fly-in");
        void welcomeDuo.offsetWidth;
        welcomeDuo.classList.add("fly-in");
      }

      function animateScreenIn(step) {
        const screen = screens[step];
        if (!screen) return;
        const nodes = screen.querySelectorAll("h1, h2, p, .bubble, .card, .mascot-img, .btn, .lang-btn, .topic-btn, .option-btn, .word-btn, .sentence-box, .audio-pill, .dots");
        nodes.forEach(function (node, idx) {
          node.classList.remove("anim-fade-up", "anim-stagger-1", "anim-stagger-2", "anim-stagger-3", "anim-stagger-4");
          void node.offsetWidth;
          node.classList.add("anim-fade-up");
          node.classList.add("anim-stagger-" + ((idx % 4) + 1));
        });
      }

      function getProgressForStep(step) {
        const firstInteractiveStep = 1;
        const lastInteractiveStep = screens.length - 1;
        if (step < firstInteractiveStep || lastInteractiveStep <= 0) return 0;
        const completed = step - firstInteractiveStep + 1;
        const total = Math.max(1, lastInteractiveStep - firstInteractiveStep + 1);
        return Math.max(0, Math.min(100, Math.round((completed / total) * 100)));
      }

      function applyTranslations() {
        document.documentElement.lang = state.selectedLanguage;
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const key = node.getAttribute("data-i18n");
          node.textContent = getT(key);
        });
      }

      function lockFor(ms, cb) {
        state.locked = true;
        window.setTimeout(function () {
          state.locked = false;
          if (typeof cb === "function") cb();
        }, ms);
      }

      function handleTap(action) {
        return function (event) {
          if (event) event.preventDefault();
          if (state.locked) return;
          action();
        };
      }

      function selectLanguage(lang) {
        if (!translations[lang]) return;
        state.selectedLanguage = lang;
        languageButtons.forEach((btn) => {
          btn.classList.toggle("selected", btn.dataset.lang === lang);
        });
        state.sentenceWords = [];
        applyTranslations();
      }

      function selectTopic(topic) {
        state.selectedTopic = topic;
        topicButtons.forEach((btn) => {
          btn.classList.toggle("selected", btn.dataset.topic === topic);
        });
      }

        const map = {
          welcomeContinue: function () { safeAdvance(2); },
          languageContinue: function () { safeAdvance(3); },
          topicContinue: function () { exitAd(); },
          goBack: function () {
            if (!state.navStack.length) return;
            const step = state.navStack.pop();

          }
        };

        app.querySelectorAll("[data-action]").forEach((el) => {
          const actionKey = el.getAttribute("data-action");
          const action = map[actionKey];
          if (!action) return;
          el.addEventListener("click", handleTap(action), { passive: false });
        });
      }

      function bindOptionPickers() {
        languageButtons.forEach((btn) => {
          btn.addEventListener("click", handleTap(function () {
            selectLanguage(btn.dataset.lang);
          }), { passive: false });
        });

        topicButtons.forEach((btn) => {
          btn.addEventListener("click", handleTap(function () {
            selectTopic(btn.dataset.topic);
          }), { passive: false });
        });

        if (welcomeDuo) {
          welcomeDuo.addEventListener("click", handleTap(function () {
            welcomeDuo.classList.remove("tap-bounce");
            void welcomeDuo.offsetWidth;
            welcomeDuo.classList.add("tap-bounce");
          }), { passive: false });
        }
      }

      function init() {
        bindStaticActions();
        bindOptionPickers();
        selectLanguage("en");
        selectTopic("travel");
        showScreen(0);
        window.setTimeout(function () {
          safeAdvance(1);
        }, FLOW_DELAYS.splash);
      }

      try {
        init();
      } catch (error) {
        showScreen(1);
      }
    })();
  </script>
</body>
</html>
